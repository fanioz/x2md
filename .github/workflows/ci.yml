name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Neither job needs write access; keep the default read/write token scoped down.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify SDK imports cleanly
        run: python -c "from apify import Actor; print('apify SDK import OK')"

      - name: Run offline test suite
        env:
          X2MD_TEST_BLOCK_NETWORK: "1"
        run: |
          cd tests
          python -m unittest discover -s . -t .

      # These two modules are skipped by the network guard above and exercise src/main.py end to end.
      - name: Run Actor entry-point tests (real SDK)
        run: |
          cd tests
          python -m unittest -v test_actor_sdk test_actor_main

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Actor image
        run: docker build --no-cache --tag x2md-actor-test .